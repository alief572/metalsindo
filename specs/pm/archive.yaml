      Product Costing" list + per-variant "Detil Isi dari Costing" breakdown
      shown as information. Verified: HPP (19.733,47 / 20.831,85), Price List
      (21.756,15 / 22.967,12), Berat per Pcs (8,04 / 8,64) still match the
      concept images; all 10 pages render with no JS errors via two Node
