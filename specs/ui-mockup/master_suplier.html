<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Supplier</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_sales.js"></script>
<script>
(function () {
  var M = Mock, S = M.seedS, cats = S.supCat, loc = S.supLoc, intl = S.supIntl;
  var page = M.shell({key:'master_suplier', title:'Master Supplier', sub:'Local, International, Kategori', module:'master_suplier', crumb:'Master Data'});
  var host = document.createElement('div'); host.className = 'box primary'; host.innerHTML = '<div class="box-body" id="tabs"></div>'; page.appendChild(host);

  function catName(id) { var c = cats.filter(function (x) { return x.id === id; })[0]; return c ? c.nama : '-'; }
  function pane(el, title, rows, isIntl) {
    el.innerHTML = '<div style="margin-bottom:8px"><span class="addw"></span></div><div class="tb"></div>';
    function addBtn() { el.querySelector('.addw').innerHTML = M.perm.Add ? '<button class="btn btn-success btn-sm">＋ Tambah Data</button>' : ''; var b = el.querySelector('.addw button'); if (b) b.onclick = function () { form(null, rows, isIntl, t); }; }
    var cols = [{key:'kat', label:'Kategori Supplier'}, {key:'nama', label:'Nama Supplier'}];
    if (isIntl) cols.push({key:'negara', label:'Negara'});
    cols.push({key:'aktif', label:'Status', html:function (r) { return M.badge(r.aktif); }, text:function (r) { return r.aktif === 'aktif' ? 'Aktif' : 'Non Aktif'; }});
    var t = M.table(el.querySelector('.tb'), {rows:function () { return rows; }, cols:cols, actions:{view:1, edit:1, del:1},
      onAction:function (a, id) { var r = rows.filter(function (x) { return x.id === id; })[0];
        if (a === 'view') view(r, isIntl); else if (a === 'edit') form(r, rows, isIntl, t);
        else M.delFlow('Data supplier akan dihapus.', 'Data supplier berhasil dihapus.', function () { rows.splice(rows.indexOf(r), 1); t.refresh(); }); }});
    addBtn(); M.onPerm(addBtn);
  }
  function view(r, isIntl) {
    M.modal('Detail Supplier', '<dl class="dl"><dt>Id Supplier</dt><dd>' + M.esc(r.id) + '</dd><dt>Kategori</dt><dd>' + M.esc(r.kat) + '</dd><dt>Nama Supplier</dt><dd>' + M.esc(r.nama) + '</dd>' +
      '<dt>Telepon</dt><dd>' + M.esc(r.telp || '-') + '</dd><dt>Email</dt><dd>' + M.esc(r.email || '-') + '</dd>' +
      (isIntl ? '<dt>Negara / Kota</dt><dd>' + M.esc((r.negara || '-') + ' / ' + (r.kota || '-')) + '</dd>' : '') +
      '<dt>Alamat</dt><dd>' + M.esc(r.alamat || '-') + '</dd><dt>Payment Term</dt><dd>' + M.esc(r.pay || '-') + '</dd><dt>MOQ</dt><dd>' + M.esc(r.moq || '-') + '</dd><dt>Status</dt><dd>' + M.badge(r.aktif) + '</dd></dl>' +
      '<div class="sect">Contact Person</div>' + M.stable([{key:'nama', label:'Nama'}, {key:'jabatan', label:'Jabatan'}], r.pic || []), {size:'sm'});
  }
  function form(r, rows, isIntl, t) {
    var edit = !!r; r = r || {pic:[{nama:'', jabatan:''}], aktif:'aktif'};
    var b = M.modal(edit ? 'Edit Supplier' : 'Tambah Supplier',
      '<form novalidate>' + M.fg('Kategori Supplier', '<select name="kat" required>' + M.opts(cats.filter(function (c) { return c.aktif === 'aktif'; }), r.kat, 'nama', 'nama') + '</select>') +
      M.fg('Nama Supplier', '<input type="text" name="nama" required value="' + M.esc(r.nama || '') + '">') +
      M.fg('Telepon', '<input type="text" name="telp" value="' + M.esc(r.telp || '') + '">') + M.fg('Email', '<input type="text" name="email" value="' + M.esc(r.email || '') + '">') +
      (isIntl ? M.fg('Negara', '<input type="text" name="negara" value="' + M.esc(r.negara || '') + '">') + M.fg('Kota', '<input type="text" name="kota" value="' + M.esc(r.kota || '') + '">') : '') +
      M.fg('Alamat', '<textarea name="alamat">' + M.esc(r.alamat || '') + '</textarea>') + M.fg('Payment Term', '<input type="text" name="pay" value="' + M.esc(r.pay || '') + '">') +
      M.fg('MOQ', '<input type="text" name="moq" value="' + M.esc(r.moq || '') + '">') +
      (edit ? M.fg('Status', '<div class="radio-row"><label><input type="radio" name="aktif" value="aktif"' + (r.aktif === 'aktif' ? ' checked' : '') + '> Aktif</label><label><input type="radio" name="aktif" value="nonaktif"' + (r.aktif !== 'aktif' ? ' checked' : '') + '> Non Aktif</label></div>') : '') +
      '<div class="sect">Contact Person</div><table class="mini"><thead><tr><th>Nama</th><th>Jabatan</th></tr></thead><tbody class="pics"></tbody></table>' +
      '<div class="form-actions"><button class="btn btn-primary" type="submit">💾 Save</button></div></form>');
    var f = b.querySelector('form'); (r.pic.length ? r.pic : [{}]).forEach(function (p) { b.querySelector('.pics').insertAdjacentHTML('beforeend', '<tr><td><input type="text" value="' + M.esc(p.nama || '') + '"></td><td><input type="text" value="' + M.esc(p.jabatan || '') + '"></td></tr>'); });
    f.onsubmit = function (e) { e.preventDefault(); if (!M.validate(f)) return;
      M.saveFlow({text:'Data supplier akan disimpan.', done:'Data supplier berhasil disimpan.', save:function () {
        var pics = [].map.call(b.querySelectorAll('.pics tr'), function (tr) { var i = tr.querySelectorAll('input'); return {nama:i[0].value, jabatan:i[1].value}; }).filter(function (p) { return p.nama; });
        var d = {kat:f.kat.value, nama:f.nama.value.trim().toUpperCase(), telp:f.telp.value, email:f.email.value, alamat:f.alamat.value, pay:f.pay.value, moq:f.moq.value, pic:pics};
        if (isIntl) { d.negara = f.negara.value; d.kota = f.kota.value; }
        if (edit) { Object.assign(r, d, {aktif:f.aktif.value}); } else { d.id = M.nextId(isIntl ? 'IS20' : 'LS20', rows); d.aktif = 'aktif'; rows.push(d); }
        t.refresh(); }}); };
  }
  function catPane(el) {
    el.innerHTML = '<div style="margin-bottom:8px"><span class="addw"></span></div><div class="tb"></div>';
    function addBtn() { el.querySelector('.addw').innerHTML = M.perm.Add ? '<button class="btn btn-success btn-sm">＋ Add</button>' : ''; var b = el.querySelector('.addw button'); if (b) b.onclick = function () { cform(null); }; }
    var t = M.table(el.querySelector('.tb'), {rows:function () { return cats; }, cols:[{key:'kode', label:'Kode'}, {key:'nama', label:'Nama Kategori'}, {key:'aktif', label:'Status', html:function (r) { return M.badge(r.aktif); }, text:function (r) { return r.aktif === 'aktif' ? 'Aktif' : 'Non Aktif'; }}],
      actions:{view:1, edit:1, del:1}, onAction:function (a, id) { var r = cats.filter(function (x) { return x.id === id; })[0];
        if (a === 'view') M.modal('Detail Kategori', '<dl class="dl"><dt>Kode</dt><dd>' + M.esc(r.kode) + '</dd><dt>Nama Kategori</dt><dd>' + M.esc(r.nama) + '</dd><dt>Status</dt><dd>' + M.badge(r.aktif) + '</dd></dl>', {size:'sm'});
        else if (a === 'edit') cform(r); else M.delFlow('Kategori akan dihapus.', 'Kategori berhasil dihapus.', function () { cats.splice(cats.indexOf(r), 1); t.refresh(); }); }});
    addBtn(); M.onPerm(addBtn);
    function cform(r) { var edit = !!r;
      var b = M.modal(edit ? 'Edit Kategori Supplier' : 'Tambah Kategori Supplier', '<form novalidate>' + M.fg('Nama Kategori', '<input type="text" name="nama" required value="' + M.esc(edit ? r.nama : '') + '">') +
        (edit ? M.fg('Status', '<div class="radio-row"><label><input type="radio" name="aktif" value="aktif"' + (r.aktif === 'aktif' ? ' checked' : '') + '> Aktif</label><label><input type="radio" name="aktif" value="nonaktif"' + (r.aktif !== 'aktif' ? ' checked' : '') + '> Non Aktif</label></div>') : '') +
        '<div class="form-actions"><button class="btn btn-primary" type="submit">💾 Save</button></div></form>', {size:'sm'});
      var f = b.querySelector('form'); f.onsubmit = function (e) { e.preventDefault(); if (!M.validate(f)) return;
        M.saveFlow({text:'Kategori akan disimpan.', done:'Kategori berhasil disimpan.', save:function () { var n = f.nama.value.trim().toUpperCase();
          if (edit) { r.nama = n; r.aktif = f.aktif.value; } else cats.push({id:M.nextId('CS20', cats), nama:n, kode:'CS' + (cats.length + 1), aktif:'aktif'}); t.refresh(); }}); }; }
  }
  M.tabs(M.$('#tabs'), [
    {label:'Local Supplier', render:function (el) { pane(el, 'Local', loc, false); }},
    {label:'International Supplier', render:function (el) { pane(el, 'International', intl, true); }},
    {label:'Master Supplier Category', render:catPane}
  ]);
})();
</script>
</body>
</html>
