<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notifikasi Costing</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_sales.js"></script>
<script src="assets/costing.js"></script>
<script src="assets/pcui.js"></script>
<script>
(function () {
  var M = Mock, P = M.pc, U = M.pcui, esc = M.esc, st = P.st;
  var page = U.head('notifikasi', 'Notifikasi Costing', 'Notifikasi lonceng (PG-11 · UC-N12)', 'Product Costing');
  page.innerHTML = '<div class="box primary"><div class="box-header"><button class="btn btn-default btn-sm" id="all">✓ Tandai semua dibaca</button></div><div class="box-body" id="tbl"></div></div>' +
    '<div class="note">Notifikasi dibuat saat <b>Update Costing</b> diklik dan ada material yang diblokir karena Price Reference-nya kedaluwarsa. Diterima oleh PIC yang memiliki akses modul terkait (modul tujuan: Price Reference; satu notifikasi per material, asumsi mockup).</div>';
  var t = M.table(M.$('#tbl'), {rows:function () { return st.ntf; }, cols:[
    {label:'Status', html:function (n) { return n.dibaca ? M.pill('Dibaca', 'gray') : M.pill('Baru', 'warn'); }, text:function (n) { return n.dibaca ? 'Dibaca' : 'Baru'; }},
    {label:'Tanggal', html:function (n) { return M.dstr(n.tgl); }, text:function (n) { return n.tgl; }}, {key:'modul', label:'Modul Tujuan'},
    {label:'Pesan', html:function (n) { return n.dibaca ? esc(n.pesan) : '<b>' + esc(n.pesan) + '</b>'; }, text:function (n) { return n.pesan; }},
    {label:'Tindak lanjut', html:function (n) { return '<a href="price_reference_purchase.html">Buka Price Reference Purchase →</a>'; }, text:function () { return ''; }}],
    actions:{view:'✓ Dibaca'}, onAction:function (a, id) { var n = st.ntf.filter(function (x) { return x.id === id; })[0]; n.dibaca = true; P.save(); U.refresh(); t.refresh(); }});
  M.$('#all').onclick = function () { st.ntf.forEach(function (n) { n.dibaca = true; }); P.save(); U.refresh(); t.refresh(); M.toast('Semua notifikasi ditandai dibaca'); };
})();
</script>
</body>
</html>
