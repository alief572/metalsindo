<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Bentuk</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script>
(function () {
  var M = Mock, S = M.seed, rows = S.bentuk;
  var page = M.shell({key:'master_bentuk', title:'Master Bentuk', sub:'Bentuk material & dimensinya', module:'master_bentuk'});
  page.innerHTML = '<div class="box primary"><div class="box-header"><span id="addwrap"></span></div><div class="box-body" id="tbl"></div></div>';

  function addBtn() { M.$('#addwrap').innerHTML = M.perm.Add ? '<button class="btn btn-success btn-sm" id="add">＋ Add</button>' : ''; if (M.perm.Add) M.$('#add').onclick = function () { form(); }; }
  addBtn(); M.onPerm(addBtn);

  var t = M.table(M.$('#tbl'), {
    rows: function () { return rows; },
    cols: [
      {key:'nama', label:'Bentuk Material'},
      {label:'Dimensi', html: function (r) { return r.dimensi.map(function (d) { return '<span class="tag">' + M.esc(d) + '</span>'; }).join(''); }, text: function (r) { return r.dimensi.join(' '); }}
    ],
    actions: {view:1, edit:1, del:1},
    onAction: function (a, id) {
      var r = rows.filter(function (x) { return x.id === id; })[0];
      if (a === 'view') view(r); else if (a === 'edit') form(r);
      else M.delFlow('Data Bentuk akan di hapus.', 'Data Bentuk berhasil dihapus.', function () { rows.splice(rows.indexOf(r), 1); t.refresh(); });
    }
  });

  function view(r) {
    M.modal('Detail Bentuk', '<dl class="dl"><dt>Id Bentuk</dt><dd>' + M.esc(r.id) + '</dd><dt>Nama Bentuk</dt><dd>' + M.esc(r.nama) + '</dd></dl>' +
      '<div class="fsec">Dimensi</div><table class="mini"><thead><tr><th width="60">#</th><th>Nama Dimensi</th></tr></thead><tbody>' +
      r.dimensi.map(function (d, i) { return '<tr><td align="center">' + (i + 1) + '</td><td>' + M.esc(d) + '</td></tr>'; }).join('') + '</tbody></table>', {size:'sm'});
  }

  function dimRow(v) {
    return '<tr><td><select name="dim">' + M.opts(S.dimensiOpsi, v || '', null, null, '--Pilih--') + '</select></td>' +
      '<td align="center" style="width:70px"><button type="button" class="btn btn-sm btn-danger del" title="Hapus Data">🗑</button></td></tr>';
  }

  function form(r) {
    var edit = r && r.id;
    var b = M.modal(edit ? 'Edit Bentuk' : 'Tambah Bentuk',
      '<form novalidate>' + M.fg('Nama Bentuk', '<input type="text" name="nama" required placeholder="Nama Bentuk" value="' + M.esc(edit ? r.nama : '') + '">') +
      '<div class="fsec">Dimensi <button type="button" class="btn btn-sm btn-success pull-right" id="addd">＋ Add</button></div>' +
      '<table class="mini"><thead><tr><th>Nama Dimensi</th><th>Action</th></tr></thead><tbody id="dim">' + (edit ? r.dimensi.map(dimRow).join('') : '') + '</tbody></table>' +
      '<div class="form-actions" style="justify-content:center"><button class="btn btn-success" type="submit">💾 Simpan</button></div></form>', {size:'sm'});
    var tb = b.querySelector('#dim');
    b.querySelector('#addd').onclick = function () { tb.insertAdjacentHTML('beforeend', dimRow('')); };
    tb.onclick = function (e) { var d = e.target.closest('.del'); if (d) d.closest('tr').remove(); };
    b.querySelector('form').onsubmit = function (e) {
      e.preventDefault(); var f = e.target; if (!M.validate(f)) return;
      var dims = Array.prototype.map.call(f.querySelectorAll('[name=dim]'), function (s) { return s.value; }).filter(Boolean);
      if (!dims.length) { M.toast('Tambahkan minimal satu dimensi', 'err'); return; }
      M.saveFlow({text:'Data akan diproses dan tidak dapat diulang.', okText:'Ya, Proses!', done:'Data Bentuk berhasil disimpan.',
        save: function () {
          var n = f.nama.value.trim().toUpperCase();
          if (edit) { r.nama = n; r.dimensi = dims; } else rows.push({id:M.nextId('B20', rows), nama:n, dimensi:dims});
          t.refresh();
        }});
    };
  }
})();
</script>
</body>
</html>
