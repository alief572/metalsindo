<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Kurs</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_sales.js"></script>
<script>
(function () {
  var M = Mock, hist = M.seedS.kurs;
  var page = M.shell({key:'master_kurs', title:'Master Kurs', sub:'Riwayat & rate kurs', module:'master_kurs', crumb:'Master Data'});
  var host = document.createElement('div'); host.className = 'box primary'; host.innerHTML = '<div class="box-body" id="tabs"></div>'; page.appendChild(host);

  function sorted() { return hist.slice().sort(function (a, b) { return a.tgl < b.tgl ? 1 : a.tgl > b.tgl ? -1 : (b.id - a.id); }); }
  function avg(days) { var s = sorted(), d0 = new Date(s[0].tgl + 'T00:00:00'); d0.setDate(d0.getDate() - days); var lim = d0.toISOString().slice(0, 10);
    var r = s.filter(function (x) { return x.tgl >= lim; }); return r.reduce(function (a, x) { return a + x.nominal; }, 0) / r.length; }

  function historyPane(el) {
    el.innerHTML = '<div style="margin-bottom:8px"><span class="addw"></span></div><div class="tb"></div>';
    function addBtn() { el.querySelector('.addw').innerHTML = M.perm.Manage ? '<button class="btn btn-success btn-sm">✎ Update Kurs</button>' : ''; var b = el.querySelector('.addw button'); if (b) b.onclick = upd; }
    var t = M.table(el.querySelector('.tb'), {rows:sorted, cols:[
      {key:'tgl', label:'Tanggal Perubahan', html:function (r) { return M.dstr(r.tgl); }, text:function (r) { return r.tgl; }},
      {key:'kode', label:'Mata Uang'}, {key:'nominal', label:'Nilai Tukar', html:function (r) { return '<span class="num" style="display:block">' + M.fmt(r.nominal, 0) + '</span>'; }, text:function (r) { return r.nominal; }},
      {key:'by', label:'User Update'}]});
    addBtn(); M.onPerm(addBtn);
    function upd() {
      var cur = sorted()[0];
      var b = M.modal('Update Kurs', '<form novalidate>' + M.fg('Mata Uang', '<input type="text" value="IDR" readonly>') + M.fg('Kurs terakhir', '<input type="text" readonly value="' + M.fmt(cur.nominal, 0) + ' (' + M.dstr(cur.tgl) + ')">') +
        M.fg('Nilai Tukar Baru (Rp per USD)', '<input type="number" name="n" required value="' + cur.nominal + '">') +
        '<div class="form-actions"><button class="btn btn-primary" type="submit">💾 Save</button></div></form>', {size:'sm'});
      var f = b.querySelector('form'); f.onsubmit = function (e) { e.preventDefault(); if (!M.validate(f)) return;
        M.saveFlow({text:'Kurs akan diperbarui.', done:'Kurs berhasil diperbarui.', save:function () { hist.push({id:hist.length + 2000, kode:'IDR', nominal:+f.n.value, tgl:new Date().toISOString().slice(0, 10), by:'admin'}); t.refresh(); }}); }; }
  }
  function ratePane(el) {
    var cur = sorted()[0];
    el.innerHTML = '<div class="sumbox"><div><small>Terakhir diperbarui</small><b>' + M.dstr(cur.tgl) + '</b></div></div>' +
      M.stable([{key:'kode', label:'Mata Uang'}, {key:'mu', label:'Keterangan'}, {label:'Kurs Terbaru', cls:'num', html:function (r) { return '<b>' + M.fmt(r.a, 0) + '</b>'; }}, {label:'Kurs 10 Hari', cls:'num', html:function (r) { return M.fmt(r.b, 0); }}, {label:'Kurs 30 Hari', cls:'num', html:function (r) { return M.fmt(r.c, 0); }}],
        [{kode:'IDR', mu:'Rupiah per 1 USD', a:cur.nominal, b:avg(10), c:avg(30)}]) +
      '<div class="note">Kurs 10 / 30 hari = rata-rata nilai tukar harian pada rentang tersebut. Penawaran memilih kurs: Spot, 10 hari, atau 30 hari.</div>';
  }
  M.tabs(M.$('#tabs'), [{label:'History Perubahan Kurs', render:historyPane}, {label:'Rate Kurs', render:ratePane}]);
})();
</script>
</body>
</html>
