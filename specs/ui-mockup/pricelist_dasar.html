<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricelist Dasar</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_sales.js"></script>
<script src="assets/costing.js"></script>
<script src="assets/pcui.js"></script>
<script>
(function () {
  var M = Mock, P = M.pc, U = M.pcui, esc = M.esc, st = P.st;
  var page = U.head('pricelist_dasar', 'Pricelist', 'Pricelist dasar semua customer (PG-12 · UC-N13)', 'Pricelist');
  var root = document.createElement('div'); page.appendChild(root);
  var lblStatus = function (s) { return {DRAFT:M.pill('DRAFT', 'gray'), DIAJUKAN:M.pill('DIAJUKAN', 'warn'), DIRILIS:M.pill('DIRILIS', 'ok')}[s] || esc(s); };

  function list() {
    root.innerHTML = '<div class="box primary"><div class="box-header"><span id="addw"></span></div><div class="box-body" id="tbl"></div></div>' +
      '<div class="note">Satuan pricelist seluruhnya <b>Rp/Kg</b> dan berlaku untuk <b>semua customer</b>. Hanya costing berstatus <b>LENGKAP</b> yang dapat masuk pricelist. Pricelist boleh memuat sebagian material dan dirilis parsial; baris yang tidak disetujui kembali ke DRAFT.</div>';
    function addBtn() { M.$('#addw').innerHTML = M.perm.Add ? '<button class="btn btn-success btn-sm" id="add">＋ Buat Pricelist</button>' : ''; if (M.perm.Add) M.$('#add').onclick = pick; }
    addBtn(); M.onPerm(addBtn);
    M.table(M.$('#tbl'), {rows:function () { return st.pl; }, cols:[{key:'no', label:'No. Pricelist'}, {label:'Tanggal', html:function (p) { return M.dstr(p.tgl); }, text:function (p) { return p.tgl; }},
      {label:'Status', html:function (p) { return lblStatus(P.plStatus(p)); }, text:function (p) { return P.plStatus(p); }},
      {label:'Baris', html:function (p) { return p.lines.length; }, text:function (p) { return p.lines.length; }},
      {label:'DIRILIS / DIAJUKAN / DRAFT', html:function (p) { var c = function (s) { return p.lines.filter(function (l) { return l.status === s; }).length; }; return c('DIRILIS') + ' / ' + c('DIAJUKAN') + ' / ' + c('DRAFT'); }, text:function () { return ''; }}],
      actions:{view:'☰ Detail'}, onAction:function (a, id) { detail(st.pl.filter(function (p) { return p.id === id; })[0]); }});
  }
  function pick() {
    var ok = st.mats.filter(function (m) { return st.cost[m.id] && st.cost[m.id].status === 'LENGKAP'; });
    var skip = st.mats.filter(function (m) { return st.cost[m.id] && st.cost[m.id].status === 'SEBAGIAN'; });
    var b = M.modal('Buat Pricelist', '<form novalidate><p>Pilih material yang diikutkan (hanya costing <b>LENGKAP</b>).</p>' +
      M.stable([{label:'', html:function (m) { return '<input type="checkbox" name="m" value="' + m.id + '" checked>'; }}, {label:'Material', html:function (m) { return esc(m.nama); }}, {label:'Bentuk', html:function (m) { return esc(m.bentuk); }}, {label:'Bottom Price (Rp/Kg)', cls:'num', html:function (m) { return M.fmt(st.cost[m.id].bottom, 2); }}], ok) +
      (skip.length ? '<div class="warnbox">Tidak ikut (costing SEBAGIAN): ' + skip.map(function (m) { return esc(m.nama); }).join(', ') + '</div>' : '') +
      '<div class="form-actions"><button class="btn btn-primary" type="submit">Buat Draft</button></div></form>', {size:'xl'});
    var f = b.querySelector('form'); f.onsubmit = function (e) { e.preventDefault(); var mids = [].map.call(b.querySelectorAll('input[name=m]:checked'), function (x) { return x.value; }); if (!mids.length) { M.toast('Pilih minimal satu material.', 'err'); return; }
      M.saveFlow({text:'Draft pricelist akan dibuat.', done:'Draft pricelist dibuat.', save:function () { P.newPricelist(mids); }, after:list}); };
  }
  function detail(p) {
    var hasDraft = p.lines.some(function (l) { return l.status === 'DRAFT'; });
    root.innerHTML = '<div class="box primary"><div class="box-header"><button class="btn btn-default btn-sm" id="back">← Back</button><span id="sub"></span><span class="pull-right">' + lblStatus(P.plStatus(p)) + '</span></div><div class="box-body">' +
      '<div class="sumbox"><div><small>No. Pricelist</small><b>' + esc(p.no) + '</b></div><div><small>Tanggal</small><b>' + M.dstr(p.tgl) + '</b></div><div><small>Disusun oleh</small><b>' + esc(p.by) + '</b></div></div>' +
      M.stable([{label:'Material', html:function (l) { return esc(U.mname(l.mid)); }}, {label:'Bentuk', html:function (l) { return esc(P.mat(l.mid).bentuk); }}, {label:'Bottom Price (Rp/Kg)', cls:'num', html:function (l) { return M.fmt(l.bottom, 2); }}, {label:'Status Baris', html:function (l) { return lblStatus(l.status); }}], p.lines) +
      (p.appr.length ? '<div class="sect">Riwayat Keputusan Management</div>' + M.stable([{label:'Tanggal', html:function (a) { return M.dstr(a.tgl); }}, {label:'Keputusan', html:function (a) { return esc(a.keputusan); }}, {label:'Disetujui', html:function (a) { return esc(a.setuju.map(U.mname).join(', ') || '-'); }}, {label:'Tidak disetujui (kembali DRAFT)', html:function (a) { return esc(a.tolak.map(U.mname).join(', ') || '-'); }}, {label:'Catatan', html:function (a) { return esc(a.catatan || '-'); }}], p.appr) : '') + '</div></div>';
    M.$('#back').onclick = list;
    function sub() { M.$('#sub').innerHTML = M.perm.Manage && hasDraft ? ' <button class="btn btn-primary btn-sm" id="aju">➤ Ajukan Approval</button>' : ''; if (M.perm.Manage && hasDraft) M.$('#aju').onclick = function () { M.saveFlow({text:'Baris berstatus DRAFT akan diajukan ke Management.', okText:'Ya, Ajukan!', done:'Pricelist diajukan untuk approval.', save:function () { P.submitPricelist(p); }, after:function () { detail(p); }}); }; }
    sub(); M.onPerm(sub);
  }
  list();
})();
</script>
</body>
</html>
