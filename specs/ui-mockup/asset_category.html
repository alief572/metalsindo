<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Category</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_asset.js"></script>
<script>
(function () {
  var M = Mock, rows = M.seedA.category, esc = M.esc;
  var page = M.shell({key:'asset_category', title:'Asset Category', sub:'Kategori asset', module:'asset_category', crumb:'Asset'});
  page.innerHTML = '<div class="box primary"><div class="box-header"><span id="addw"></span></div><div class="box-body" id="tbl"></div></div>' +
    '<div class="note">Kategori <b>Machine</b> dipakai sebagai sumber pilihan mesin pada <b>Flow Process</b> (Product Costing): hanya asset dengan kategori ini yang dapat dipilih sebagai mesin proses.</div>';
  function addBtn() { M.$('#addw').innerHTML = M.perm.Add ? '<button class="btn btn-success btn-sm" id="add">＋ Add</button>' : ''; if (M.perm.Add) M.$('#add').onclick = function () { form(null); }; }
  addBtn(); M.onPerm(addBtn);
  var t = M.table(M.$('#tbl'), {rows:function () { return rows; }, cols:[
    {key:'tipe', label:'Type Asset'}, {key:'nama', label:'Nama Asset'}, {label:'Jangka Waktu (Tahun)', html:function (r) { return '<span class="num" style="display:block">' + r.tahun + '</span>'; }, text:function (r) { return r.tahun; }}],
    actions:{view:1, edit:1, del:1}, onAction:function (a, id) { var r = rows.filter(function (x) { return String(x.id) === id; })[0];
      if (a === 'view') M.modal('Detail Kategori Asset', '<dl class="dl"><dt>Nama Kategori</dt><dd>' + esc(r.nama) + '</dd><dt>Type</dt><dd>' + esc(r.tipe) + '</dd><dt>Jangka Waktu</dt><dd>' + r.tahun + ' tahun</dd></dl>', {size:'sm'});
      else if (a === 'edit') form(r); else M.delFlow('Kategori asset akan dihapus.', 'Kategori berhasil dihapus.', function () { rows.splice(rows.indexOf(r), 1); t.refresh(); }); }});

  function form(r) {
    var edit = !!r;
    var b = M.modal(edit ? 'Edit Kategori Asset' : 'Tambah Kategori Asset', '<form novalidate>' + M.fg('Nama Kategori Asset', '<input type="text" name="nama" required value="' + esc(edit ? r.nama : '') + '">') +
      M.fg('Type', '<select name="tipe" required>' + M.opts(['BERGERAK', 'TIDAK BERGERAK'], edit ? r.tipe : '', null, null, '--PILIH--') + '</select>') +
      M.fg('Jangka Waktu (Tahun)', '<input type="number" name="tahun" required value="' + (edit ? r.tahun : '') + '">') + '<div class="form-actions"><button class="btn btn-primary" type="submit">💾 Save</button></div></form>', {size:'sm'});
    var f = b.querySelector('form'); f.onsubmit = function (e) { e.preventDefault(); if (!M.validate(f)) return;
      M.saveFlow({text:'Kategori asset akan disimpan.', done:'Kategori asset berhasil disimpan.', save:function () { var o = {nama:f.nama.value.trim(), tipe:f.tipe.value, tahun:+f.tahun.value};
        if (edit) Object.assign(r, o); else { o.id = Math.max.apply(null, rows.map(function (x) { return x.id; })) + 1; rows.push(o); } t.refresh(); }}); };
  }
})();
</script>
</body>
</html>
