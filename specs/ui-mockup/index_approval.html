<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approval Revisi Penawaran</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_sales.js"></script>
<script src="assets/costing.js"></script>
<script src="assets/pen.js"></script>
<script>
(function () {
  var M = Mock, S = M.seedS;
  var page = M.shell({key:'index_approval', title:'Approval Revisi Penawaran', sub:'index_approval', module:'penawaran/index_approval', crumb:'Penjualan'});
  var host = document.createElement('div'); page.appendChild(host);
  M.tabs(host, [
    {label:'Penawaran Material', render:function (el) { M.pen.build(el, {type:'reguler', rows:S.penawaran, spkRows:S.spk, approval:true}); }},
    {label:'Penawaran Slitting', render:function (el) { M.pen.build(el, {type:'slitting', rows:S.penawaranSlit, spkRows:S.spkSlit, approval:true}); }}
  ]);
})();
</script>
</body>
</html>
