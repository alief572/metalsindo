<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Level 3 - Alloy</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script>
(function () {
  var M = Mock, S = M.seed, rows = S.cat2;
  var page = M.shell({key:'inventory_3', title:'Inventory Category', sub:'Level 3 - Alloy', module:'inventory_3'});
  page.innerHTML = '<div class="box primary"><div class="box-header"><span id="addwrap"></span></div><div class="box-body" id="tbl"></div></div>';
  function c1(id) { return S.cat1.filter(function (x) { return x.id === id; })[0] || {}; }
  function typeName(id) { var t = S.type.filter(function (x) { return x.id === id; })[0]; return t ? t.nama : '-'; }

  function addBtn() { M.$('#addwrap').innerHTML = M.perm.Add ? '<button class="btn btn-success btn-sm" id="add">＋ Add</button>' : ''; if (M.perm.Add) M.$('#add').onclick = function () { form(); }; }
  addBtn(); M.onPerm(addBtn);

  var t = M.table(M.$('#tbl'), {
    rows: function () { return rows; },
    cols: [
      {key:'id', label:'Id Level II', width:'11%'},
      {label:'Nama Type', text: function (r) { return typeName(c1(r.id_cat1).id_type); }},
      {label:'Nama Level I', text: function (r) { return c1(r.id_cat1).nama || '-'; }},
      {key:'nama', label:'Nama Level II'},
      {key:'coretax', label:'Kode Coretax'},
      {label:'Status', html: function (r) { return M.badge(r.aktif); }, text: function (r) { return r.aktif === 'aktif' ? 'Aktif' : 'Non Aktif'; }}
    ],
    actions: {view:1, edit:1, del:1},
    onAction: function (a, id) {
      var r = rows.filter(function (x) { return x.id === id; })[0];
      if (a === 'view') view(r); else if (a === 'edit') form(r);
      else M.delFlow('Data Inventory akan di hapus.', 'Data Inventory berhasil dihapus.', function () { rows.splice(rows.indexOf(r), 1); t.refresh(); });
    }
  });

  function view(r) {
    var p = c1(r.id_cat1);
    M.modal('Detail Inventory', '<dl class="dl"><dt>Id Level II</dt><dd>' + M.esc(r.id) + '</dd><dt>Inventory Type</dt><dd>' + M.esc(typeName(p.id_type)) + '</dd>' +
      '<dt>Level I (Material)</dt><dd>' + M.esc(p.nama || '-') + '</dd><dt>Inventory Name</dt><dd>' + M.esc(r.nama) + '</dd>' +
      '<dt>Kode Coretax</dt><dd>' + M.esc(r.coretax) + '</dd><dt>Status</dt><dd>' + M.badge(r.aktif) + '</dd></dl>');
  }

  function form(r) {
    var edit = r && r.id, curType = edit ? c1(r.id_cat1).id_type : '';
    var b = M.modal(edit ? 'Edit Inventory' : 'Tambah Inventory',
      '<form novalidate>' +
      M.fg('Inventory Type', '<select name="id_type" required>' + M.opts(S.type.filter(function (x) { return x.aktif === 'aktif'; }), curType, 'id', 'nama', '-- inventory --') + '</select>') +
      M.fg('Material', '<select name="id_cat1" required></select>', 'Pilihan mengikuti Inventory Type') +
      M.fg('Inventory Name', '<input type="text" name="nama" required placeholder="Nama Inventory" value="' + M.esc(edit ? r.nama : '') + '">') +
      M.fg('Kode Coretax', '<input type="text" name="coretax" required placeholder="Kode Coretax" value="' + M.esc(edit ? r.coretax : '') + '">') +
      (edit ? M.fg('Status', '<div class="radio-row"><label><input type="radio" name="aktif" value="aktif"' + (r.aktif === 'aktif' ? ' checked' : '') + '> Aktif</label>' +
        '<label><input type="radio" name="aktif" value="nonaktif"' + (r.aktif !== 'aktif' ? ' checked' : '') + '> Non Aktif</label></div>') : '') +
      '<div class="form-actions"><button class="btn btn-primary" type="submit">💾 Save</button></div></form>', {size:'sm'});
    var f = b.querySelector('form');
    function fillCat1(sel) {
      f.id_cat1.innerHTML = M.opts(S.cat1.filter(function (x) { return x.id_type === f.id_type.value && x.aktif === 'aktif'; }), sel || '', 'id', 'nama', '-- inventory --');
    }
    fillCat1(edit ? r.id_cat1 : ''); f.id_type.onchange = function () { fillCat1(''); };
    f.onsubmit = function (e) {
      e.preventDefault(); if (!M.validate(f)) return;
      M.saveFlow({text:'Data Inventory akan di simpan.', done:'Data Inventory berhasil disimpan.',
        save: function () {
          var d = {id_cat1:f.id_cat1.value, nama:f.nama.value.trim().toUpperCase(), coretax:f.coretax.value.trim()};
          if (edit) { Object.assign(r, d, {aktif:f.aktif.value}); }
          else rows.push(Object.assign({id:M.nextId('I20', rows), aktif:'aktif'}, d));
          t.refresh();
        }});
    };
  }
})();
</script>
</body>
</html>
