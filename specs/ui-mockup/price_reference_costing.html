<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Reference Costing</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_sales.js"></script>
<script src="assets/costing.js"></script>
<script src="assets/pcui.js"></script>
<script>
(function () {
  var M = Mock, P = M.pc, U = M.pcui, esc = M.esc, st = P.st;
  var page = U.head('price_reference_costing', 'Price Reference Costing', 'Costing Price untuk costing (PG-05 · UC-N06)', 'Price Reference');
  page.innerHTML = '<div class="box primary"><div class="box-body" id="tbl"></div></div>' +
    '<div class="note">Halaman baca saja. Data <b>diturunkan otomatis dari Costing Price Purchase</b> dan <b>masa berlakunya mengikuti baris Purchase</b> sumbernya (masa berlaku global per tipe: Ferrous / Non Ferrous). Price Reference yang kedaluwarsa memblokir Update Costing untuk material tersebut.</div>';
  var t = M.table(M.$('#tbl'), {rows:function () { var seen = {}, out = []; st.prcd.slice().sort(function (a, b) { return a.tgl < b.tgl ? 1 : -1; }).forEach(function (c) { if (!seen[c.mid]) { seen[c.mid] = 1; out.push(c); } }); return out.map(function (c) { var m = P.mat(c.mid); return {id:c.mid, c:c, nama:m.nama, bentuk:m.bentuk, maker:m.bentuk === 'ROLL' ? m.maker : '(tanpa maker)'}; }); }, cols:[
    {key:'nama', label:'Material'}, {key:'bentuk', label:'Bentuk'}, {key:'maker', label:'Maker'},
    {label:'Costing Price (USD/Kg)', html:function (r) { return '<span class="num" style="display:block">' + M.fmt(r.c.cp_usd, 2) + '</span>'; }, text:function (r) { return r.c.cp_usd; }},
    {label:'Costing Price (Rp/Kg)', html:function (r) { return '<span class="num" style="display:block">' + M.fmt(r.c.cp_rp, 0) + '</span>'; }, text:function (r) { return r.c.cp_rp; }},
    {label:'Masa Berlaku (tipe)', html:function (r) { return esc(P.tipeLabel(P.mat(r.id).tipe) + ': ' + P.opsiLabel(r.c.opsi)); }, text:function (r) { return P.tipeLabel(P.mat(r.id).tipe) + ': ' + P.opsiLabel(r.c.opsi); }},
    {label:'Berlaku s/d', html:function (r) { return M.dstr(r.c.sd); }, text:function (r) { return r.c.sd; }},
    {label:'Status', html:function (r) { return U.badgePR(r.c); }, text:function (r) { return P.expired(r.c) ? 'Kedaluwarsa' : 'Berlaku'; }},
    {label:'Sumber Purchase', html:function (r) { return M.dstr(r.c.tgl); }, text:function (r) { return r.c.tgl; }}],
    actions:{view:'☰ Riwayat'}, onAction:function (a, id) {
      var rows = st.prcd.filter(function (c) { return c.mid === id; }).sort(function (a, b) { return a.tgl < b.tgl ? 1 : -1; });
      M.modal('Riwayat Price Reference Costing - ' + U.mname(id), M.stable([{label:'Tanggal', html:function (c) { return M.dstr(c.tgl); }}, {label:'Costing Price USD/Kg', cls:'num', html:function (c) { return M.fmt(c.cp_usd, 2); }}, {label:'Costing Price Rp/Kg', cls:'num', html:function (c) { return M.fmt(c.cp_rp, 0); }},
        {label:'Masa Berlaku', html:function (c) { return esc(P.opsiLabel(c.opsi)); }}, {label:'Berlaku s/d', html:function (c) { return M.dstr(c.sd); }}, {label:'Status', html:function (c) { return U.badgePR(c); }}], rows), {size:'xl'}); }});
})();
</script>
</body>
</html>
