<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penawaran Material</title>
<link rel="stylesheet" href="assets/mock.css">
</head>
<body>
<div id="app"></div>
<script src="assets/mock.js"></script>
<script src="assets/seed_sales.js"></script>
<script src="assets/costing.js"></script>
<script src="assets/pen.js"></script>
<script>
(function () {
  var M = Mock, S = M.seedS;
  var page = M.shell({key:'penawaran', title:'Penawaran', sub:'Penjualan Material', module:'penawaran', crumb:'Penjualan'});
  page.insertAdjacentHTML('beforeend', '<div class="note">Status Open / Closed, revisi, dan keterangan SPK pada contoh ini diturunkan untuk peragaan (tabel header <code>tr_penawaran</code> tidak ada di DB lokal). Baris item lama berasal dari <code>child_penawaran</code>. <b>Item baru</b>: Bentuk lalu Material, Pricelist dari <b>pricelist dirilis</b> (Rp/Kg, semua customer) dibulatkan ke atas kelipatan Rp100 menjadi <b>Pricelist Roundup</b>; <b>Price Quotation</b> default-nya Roundup dan dapat diedit; Roll = Price Quotation × Kg order, Sheet = Price Quotation × Berat/Sheet × Qty sheet. <b>Diskon per penawaran</b> (persen atau Rp) lebih dari 5% atau item di bawah Bottom Price memerlukan <b>Approval Direktur</b> (menu Approval Diskon Penawaran). Dasar Harga, Komisi, dan Profit % lama digantikan.</div>');
  M.pen.build(page, {type:'reguler', rows:S.penawaran, spkRows:S.spk});
})();
</script>
</body>
</html>
