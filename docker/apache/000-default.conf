<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www

    # Redirect root / ke /metalsindo_2/ agar kompatibel penuh dengan base_url CodeIgniter
    RedirectMatch ^/$ /metalsindo_2/

    <Directory /var/www/metalsindo_2>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
